<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservas Riviera Maya</title>
<link rel="stylesheet" href="styles.css">
<script src="app.js" defer></script>
</head>
<body>
<header class="encabezado">
<h1>Reservas Riviera Maya</h1>
<p>Selecciona y calcula tu experiencia turística</p>
</header>
<main class="contenedor">
<section class="controles" aria-label="Controles del catálogo">
<input id="buscador" type="search" placeholder="Buscar experiencia...">
<select id="filtroCategoria">
<option value="todas">Todas las categorías</option>
<option value="naturaleza">Naturaleza</option>
<option value="cultura">Cultura</option>
<option value="aventura">Aventura</option>
<option value="gastronomia">Gastronomía</option>
</select>
<select id="ordenPrecio">
<option value="normal">Orden original</option>
<option value="ascendente">Menor precio</option>
<option value="descendente">Mayor precio</option>
</select>
<!-- Nuevo Filtro: Precio Máximo -->
<div class="filtro-precio">
  <label for="precioMaximo">Precio Máximo: $<span id="valorPrecioMax">1500</span></label>
  <input type="range" id="precioMaximo" min="0" max="1500" step="50" value="1500">
</div>
</section>
<p id="estado" class="estado">Cargando experiencias...</p>
<!-- Contenedor para mensajes de error sin usar alert() -->
<div id="mensaje-alerta" class="mensaje-oculto"></div>
<section id="catalogo" class="catalogo"></section>
<section class="resumen">
<div class="encabezado-resumen">
  <h2>Mi reservación</h2>
  <button id="btn-vaciar" class="btn-eliminar" style="display: none;">Vaciar reservación</button>
</div>
<div id="listaReservas"><p>No hay experiencias seleccionadas.</p></div>
<div class="totales-resumen">
  <p class="total-personas">Personas totales: <span id="totalPersonas">0</span></p>
  <p class="total">Total: <span id="total">$0 MXN</span></p>
</div>
</section>
</main>
<footer><p>Proyecto académico de frontend</p></footer>
</body>
</html>
